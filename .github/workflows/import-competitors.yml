name: Import FIS Competitors CSV

on:
  # Times are UTC: 5:00 UTC = 6:00 in Paris in winter (7:00 in summer).
  # GitHub may start scheduled jobs late.
  schedule:
    # FIS publishes its points lists on Tuesdays: check every hour from 6:00
    # to 12:00 Paris time, until the new list has been imported.
    - cron: "0 5-11 * * 2"
    # The other days, one check at 6:00 in case a list comes out another day
    - cron: "0 5 * * 0,1,3,4,5,6"
  workflow_dispatch: # Allow manual trigger

# Never run two imports at once (both would push scripts/.last-listid)
concurrency:
  group: import-competitors
  cancel-in-progress: false

jobs:
  import-competitors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # enough history to see today's last-listid commit
      # A new list was already imported today (scripts/.last-listid committed
      # today, Paris time): the remaining Tuesday runs stop here. A manual run
      # always goes ahead.
      - name: Already imported today?
        id: today
        run: |
          last=$(TZ=Europe/Paris git log -1 --format=%cd --date=format-local:%F -- scripts/.last-listid)
          today=$(TZ=Europe/Paris date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "New FIS list already imported today ($today): nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.today.outputs.skip != 'true'
      - name: Setup Node.js
        if: steps.today.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.today.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      # The import script downloads the CSV itself, starting from the listid
      # recorded in scripts/.last-listid. It imports nothing when FIS has not
      # published a newer list.
      - name: Run import script
        if: steps.today.outputs.skip != 'true'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node scripts/import-competitors.cjs FIS-points-list.csv
      - name: Commit and push .last-listid if changed
        if: steps.today.outputs.skip != 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add scripts/.last-listid
          git commit -m "chore: update last-listid [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
